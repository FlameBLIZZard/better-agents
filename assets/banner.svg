<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <!-- Deep black background -->
  <rect width="800" height="250" fill="#000000" />
  
  <!-- Subtle wave at the bottom to match the old capsule-render style -->
  <path d="M0,250 L0,200 C200,150 600,250 800,200 L800,250 Z" fill="#111111" />
  <path d="M0,250 L0,210 C300,170 500,260 800,210 L800,250 Z" fill="#222222" opacity="0.5" />

  <!-- Subtle Chromatic Aberration Text Group -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="80" text-anchor="middle">
    
    <!-- Red/Magenta Shift (Slight 3px Left) -->
    <text x="397" y="130" fill="#ff0055" opacity="0.6" style="mix-blend-mode: screen;">Better Agents</text>
    
    <!-- Blue/Cyan Shift (Slight 3px Right) -->
    <text x="403" y="130" fill="#00f0ff" opacity="0.6" style="mix-blend-mode: screen;">Better Agents</text>
    
    <!-- Core White Text -->
    <text x="400" y="130" fill="#ffffff">Better Agents</text>
    
  </g>

  <!-- Clean Subtitle -->
  <text x="400" y="175" fill="#cccccc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle">The Ultimate AI Agent Toolkit</text>
</svg>
