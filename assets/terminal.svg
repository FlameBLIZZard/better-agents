<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" rx="10" ry="10" fill="#0f172a" />
  <rect width="800" height="30" rx="10" ry="10" fill="#1e293b" />
  <circle cx="20" cy="15" r="6" fill="#ef4444" />
  <circle cx="40" cy="15" r="6" fill="#eab308" />
  <circle cx="60" cy="15" r="6" fill="#22c55e" />

  <g font-family="Consolas, monospace" font-size="16" fill="#e2e8f0">
    <text x="20" y="70" fill="#22c55e">➜</text>
    <text x="40" y="70" fill="#38bdf8">~</text>
    
    <text x="60" y="70">
      <tspan fill="#eab308">npx</tspan> github:FlameBLIZZard/better-agents
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.2s" fill="freeze" />
    </text>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.5s" fill="freeze" />
      <text x="20" y="110" fill="#c026d3">┌   Better Agents - Universal Installer</text>
      <text x="20" y="135" fill="#c026d3">│</text>
      <text x="20" y="160" fill="#c026d3">◇  Select Core Rules:</text>
      <text x="20" y="185" fill="#c026d3">│  <tspan fill="#22c55e">● artifact_first</tspan> <tspan fill="#64748b">○ beginner_documentation</tspan></text>
      <text x="20" y="210" fill="#c026d3">│</text>
      <text x="20" y="235" fill="#c026d3">◇  Install the "Time Machine" Hook?</text>
      <text x="20" y="260" fill="#c026d3">│  <tspan fill="#22c55e">● Yes (Recommended)</tspan></text>
      <text x="20" y="285" fill="#c026d3">│</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="2.5s" fill="freeze" />
      <text x="20" y="310" fill="#22c55e">✔ Successfully installed customized modules.</text>
      <text x="20" y="335" fill="#c026d3">│</text>
      <text x="20" y="360" fill="#c026d3">└  You are all set! Happy Vibecoding.</text>
