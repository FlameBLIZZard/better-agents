<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" rx="10" ry="10" fill="#111111" />
  <rect width="800" height="30" rx="10" ry="10" fill="#222222" />
  <circle cx="20" cy="15" r="6" fill="#444444" />
  <circle cx="40" cy="15" r="6" fill="#444444" />
  <circle cx="60" cy="15" r="6" fill="#444444" />

  <g font-family="Consolas, Monaco, monospace" font-size="15" fill="#ffffff">
    <!-- Terminal Prompt -->
    <text x="20" y="70" fill="#888888">➜</text>
    <text x="40" y="70" fill="#888888">~</text>
    
    <!-- Typing Command -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.5s" fill="freeze" />
      <text x="60" y="70">npx github:FlameBLIZZard/better-agents</text>
    </g>

    <!-- Header (Loads at 1.5s) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.5s" fill="freeze" />
      <text x="20" y="110" fill="#dddddd">┌   Better Agents - Universal Installer</text>
      <text x="20" y="130" fill="#666666">│</text>
    </g>

    <!-- Question 1: Unselected (Loads at 2.5s) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.5s" fill="freeze" />
      <set attributeName="opacity" to="0" begin="3.5s" fill="freeze" />
      <text x="20" y="150" fill="#dddddd">◇  Select Core Rules:</text>
      <text x="20" y="170" fill="#666666">│  <tspan fill="#888888">○ artifact_first</tspan> <tspan fill="#888888">○ beginner_documentation</tspan></text>
    </g>

    <!-- Question 1: Selected (Replaces previous layer at 3.5s) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.5s" fill="freeze" />
      <text x="20" y="150" fill="#dddddd">◇  Select Core Rules:</text>
      <text x="20" y="170" fill="#666666">│  <tspan fill="#ffffff">● artifact_first</tspan> <tspan fill="#888888">○ beginner_documentation</tspan></text>
    </g>

    <!-- Question 2: Unselected (Loads at 4.5s) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="4.5s" fill="freeze" />
      <set attributeName="opacity" to="0" begin="5.5s" fill="freeze" />
      <text x="20" y="190" fill="#666666">│</text>
      <text x="20" y="210" fill="#dddddd">◇  Install the "Time Machine" Hook?</text>
      <text x="20" y="230" fill="#666666">│  <tspan fill="#888888">○ Yes (Recommended)</tspan>  <tspan fill="#888888">○ No</tspan></text>
    </g>

    <!-- Question 2: Selected (Replaces previous layer at 5.5s) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="5.5s" fill="freeze" />
      <text x="20" y="190" fill="#666666">│</text>
      <text x="20" y="210" fill="#dddddd">◇  Install the "Time Machine" Hook?</text>
      <text x="20" y="230" fill="#666666">│  <tspan fill="#ffffff">● Yes (Recommended)</tspan>  <tspan fill="#888888">○ No</tspan></text>
    </g>

    <!-- Loading UI (Loads at 6.0s) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="6.0s" fill="freeze" />
      <set attributeName="opacity" to="0" begin="7.5s" fill="freeze" />
      <text x="20" y="250" fill="#666666">│</text>
      <text x="20" y="270" fill="#888888">◒  Compiling modules into .agents/...</text>
    </g>

    <!-- Success Message (Loads at 7.5s) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="7.5s" fill="freeze" />
      <text x="20" y="250" fill="#666666">│</text>
      <text x="20" y="270" fill="#dddddd">✔  Successfully installed customized modules.</text>
      <text x="20" y="290" fill="#666666">│</text>
      <text x="20" y="310" fill="#dddddd">└  You are all set! Happy Vibecoding.</text>
      
      <!-- Final Prompt return -->
      <text x="20" y="350" fill="#888888">➜</text>
      <text x="40" y="350" fill="#888888">~</text>
    </g>

    <!-- Blinking Cursor -->
    <g opacity="0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="7.8s" repeatCount="indefinite" />
      <rect x="60" y="335" width="10" height="20" fill="#888888" />
    </g>
  </g>
</svg>
